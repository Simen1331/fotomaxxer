[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dunce = "1"
imagesize = "0.15"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = "=2.0.0-rc.15"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", features = ["json"] }

[profile.dev.package."*"]
# Avhengigheter (bildedekoding, ort) optimaliseres også i dev — ellers er spiken ubrukelig treg.
opt-level = 3
