[project]
name = "fotomaxxer"
version = "0.1.0"
description = "Lokal-først, bærbar foto-kuratering for trykte album"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "pillow-heif",
    "pyexiftool",
    "requests",
    "insightface",
    "onnxruntime",
    "numpy",
    "scikit-learn>=1.3",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
fotomaxxer = "fotomaxxer.cli:main"
fotomaxxer-desktop = "fotomaxxer.desktop:main"

[project.optional-dependencies]
desktop = ["PySide6==6.11.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fotomaxxer", "api", "api.routers"]
