[package]
name = "fotomaxxer-api"
description = "HTTP-API-et (axum): samme kontrakt som FastAPI-versjonen i api/, jobbkjører og servering av SPA-en"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
fotomaxxer-core = { path = "../core" }
form_urlencoded = "1"
httpdate = "1"
md-5 = "0.11"
rusqlite.workspace = true
# web/dist bakes inn i release-binæren; i debug leses filene fra disk ved kjøretid.
# `allow_missing` gjør at craten bygger også uten web/dist (da serveres ingen SPA).
rust-embed = "8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "signal", "macros", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
